<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter your access code · Teach.ai</title>
<meta name="description" content="Early access to Teach.ai is by invitation.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF8F4">
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" id="fav-svg" type="image/svg+xml" href="/brand/icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/brand.js"></script>
<script src="/theme.js"></script>
<link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/picker.css">
</head>
<body data-page="access">
<!--NAV-->

<main id="main" class="gate">
  <div class="gate-card">
    <h1 data-s-html="access.title"></h1>
    <p class="lead" data-s="access.sub"></p>
    <form id="gate-form" novalidate autocomplete="off">
      <label for="code" data-s="access.label"></label>
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="40" dir="ltr" placeholder="ABCD-EFGH-JKLM" required>
      <button class="btn btn-primary btn-lg" type="submit"><span data-s="access.btn"></span></button>
      <div class="gate-msg" role="status" aria-live="polite"></div>
    </form>
    <p class="gate-join"><a href="/#pricing" data-s="access.join"></a></p>
  </div>
</main>

<!--FOOTER-->

<script src="/site-config.js"></script>
<script src="/site-i18n.js"></script>
<script src="/theme-ui.js"></script>
<script src="/site.js"></script>
<script src="/site-access.js"></script>
</body>
</html>
